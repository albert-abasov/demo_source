<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>stx playground</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 1rem auto; max-width: 960px; padding: 0 1rem; }
      header { display: flex; align-items: baseline; gap: .75rem; }
      h1 { font-size: 1.5rem; margin: 0; }
      .controls { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; margin: 1rem 0; }
      input[type="file"] { max-width: 320px; }
      button { padding: .4rem .7rem; }
      .row { display: grid; grid-template-columns: 1fr 6px 1fr; gap: 1rem; align-items: stretch; }
      .col { min-width: 260px; display: flex; flex-direction: column; overflow: visible; }
      .splitter { width: 6px; cursor: col-resize; background: color-mix(in lab, CanvasText 15%, Canvas); border-radius: 4px; }
      .splitter:hover, .splitter:focus { background: color-mix(in lab, CanvasText 25%, Canvas); outline: none; }
      textarea, pre, #output { width: 100%; box-sizing: border-box; padding: .75rem; border: 1px solid #8884; border-radius: 6px; }
      pre { background: #1112; margin: 0; height: 60vh; overflow: auto; resize: vertical; }
      pre, pre code { white-space: pre; overflow-wrap: normal; word-break: normal; }
  
      .meta { font-size: .9rem; opacity: .8; }
      .error { color: #b00020; }
      a { text-decoration: none; }
      /* JSON tree styles */
      #output { background: #1112; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, Monaco, monospace; font-size: 13px; line-height: 1.4; height: 60vh; overflow: auto; resize: vertical; }
      .jt-key { color: #7aa2f7; }
      .jt-type { color: #9ece6a; opacity: .9; }
      .jt-null { color: #c0caf5; opacity: .8; }
      .jt-string { color: #e0af68; }
      .jt-number { color: #bb9af7; }
      .jt-boolean { color: #f7768e; }
      .jt-node { margin-left: .75rem; }
      details summary { cursor: pointer; }
      details summary::-webkit-details-marker { margin-right: .25rem; }
  .compact-control { display: inline-flex; align-items: center; gap: .4rem; white-space: nowrap; }
    </style>
  </head>
  <body>
    <header>
      <h1>stx playground</h1>
      <span class="meta">Load a .sou (VisualWorks Smalltalk XML) and view parsed JSON</span>
    </header>
    <section class="controls">
      <input id="file" type="file" accept=".sou,.xml,.st" />
      <button id="btnParse" type="button">Parse selected file</button>
      <button id="btnLoadSample" type="button">Load sample FooPkg.sou</button>
      <button id="btnExpand" type="button" title="Expand all nodes">Expand all</button>
      <button id="btnCollapse" type="button" title="Collapse all nodes">Collapse all</button>
      <span class="compact-control">
        <label id="viewModeLabel" for="viewMode" class="meta">View by:</label>
        <select id="viewMode" aria-labelledby="viewModeLabel">
          <option value="class">Class</option>
          <option value="package">Package</option>
        </select>
      </span>
      <span id="status" class="meta"></span>
    </section>

    <div class="row" id="splitRow" style="grid-template-columns: 1fr 6px 1fr;">
      <div class="col" id="leftCol">
        <label class="meta" for="source">Source (read-only)</label>
        <pre id="sourcePre"><code id="source" class="language-xml"><!-- File contents will appear here after selection... --></code></pre>
      </div>
      <div id="splitter" class="splitter" role="separator" aria-orientation="vertical" aria-label="Resize panels" tabindex="0"></div>
      <div class="col" id="rightCol">
        <label class="meta" for="output">Parsed output (JSON)</label>
        <div id="output" class="json-tree" aria-live="polite" aria-busy="false"></div>
      </div>
    </div>

    <p class="meta">
      Tip: You can also test with the repo sample: <code>sampleFiles/FooPkg.sou</code>
    </p>

    <script type="module" src="./main.js"></script>
  </body>
  </html>
